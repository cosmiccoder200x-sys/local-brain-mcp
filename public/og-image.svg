<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11" />
      <stop offset="50%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#06090E" />
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Logo Mark (Centered Above): app tile, self-contained on any background -->
  <g transform="translate(540, 110) scale(0.95)">
    <rect x="4" y="4" width="120" height="120" rx="28" fill="#090D16" stroke="#1E293B" stroke-width="2" />
    <g fill="none" stroke="url(#grad)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 46 46 L 64 62 L 46 78" stroke-width="10" />
      <path d="M 70 78 H 88" stroke-width="10" />
    </g>
    <g fill="none" stroke="url(#grad)" stroke-width="4.5" stroke-linecap="round">
      <path d="M 36 62 H 26" />
      <path d="M 58 36 V 26" />
      <path d="M 92 50 L 101 41" />
      <path d="M 66 88 V 99" />
      <path d="M 44 88 L 35 97" />
    </g>
    <g fill="url(#grad)">
      <circle cx="21" cy="62" r="5" />
      <circle cx="58" cy="21" r="5" />
      <circle cx="104" cy="38" r="4.5" />
      <circle cx="66" cy="104" r="5" />
      <circle cx="32" cy="100" r="4.5" />
    </g>
  </g>

  <!-- Title & Typography -->
  <text x="600" y="310" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">
    Local Brain MCP
  </text>

  <text x="600" y="370" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#94A3B8" letter-spacing="-0.2">
    Shared, local-first memory infrastructure for AI coding agents.
  </text>

  <!-- Agent Badges Bar -->
  <g transform="translate(600, 470)">
    <g transform="translate(-360, 0)">
      <rect x="-65" y="-20" width="130" height="40" rx="20" fill="#141B2D" stroke="#1E293B" stroke-width="1.5" />
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Claude Code</text>
    </g>
    <g transform="translate(-180, 0)">
      <rect x="-55" y="-20" width="110" height="40" rx="20" fill="#141B2D" stroke="#1E293B" stroke-width="1.5" />
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Cursor</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-70" y="-20" width="140" height="40" rx="20" fill="#141B2D" stroke="url(#grad)" stroke-width="1.5" />
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#06B6D4">Local Brain</text>
    </g>
    <g transform="translate(180, 0)">
      <rect x="-65" y="-20" width="130" height="40" rx="20" fill="#141B2D" stroke="#1E293B" stroke-width="1.5" />
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Antigravity</text>
    </g>
    <g transform="translate(360, 0)">
      <rect x="-55" y="-20" width="110" height="40" rx="20" fill="#141B2D" stroke="#1E293B" stroke-width="1.5" />
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Copilot</text>
    </g>
  </g>

  <!-- Bottom Details -->
  <text x="600" y="560" text-anchor="middle" font-family="monospace" font-size="14" fill="#64748B" letter-spacing="1">
    100% OFFLINE • EMBEDDED SQLITE • 0 EXTERNAL EGRESS • &lt;5MS LATENCY
  </text>
</svg>
