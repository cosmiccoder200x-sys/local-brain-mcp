<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="lb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- App tile: dark rounded square, visible on light and dark backgrounds -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#090D16" stroke="#1E293B" stroke-width="2" />

  <!-- Terminal prompt: the visual center -->
  <g fill="none" stroke="url(#lb-grad)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 46 46 L 64 62 L 46 78" stroke-width="10" />
    <path d="M 70 78 H 88" stroke-width="10" />
  </g>

  <!-- Circuit traces growing out of the prompt like synapses -->
  <g fill="none" stroke="url(#lb-grad)" stroke-width="4.5" stroke-linecap="round">
    <path d="M 36 62 H 26" />
    <path d="M 58 36 V 26" />
    <path d="M 92 50 L 101 41" />
    <path d="M 66 88 V 99" />
    <path d="M 44 88 L 35 97" />
  </g>

  <!-- Synapse nodes -->
  <g fill="url(#lb-grad)">
    <circle cx="21" cy="62" r="5" />
    <circle cx="58" cy="21" r="5" />
    <circle cx="104" cy="38" r="4.5" />
    <circle cx="66" cy="104" r="5" />
    <circle cx="32" cy="100" r="4.5" />
  </g>
</svg>
