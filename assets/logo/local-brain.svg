<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="lb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="lb-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Left Hemisphere: Neural Cortex & Synapses -->
  <g fill="none" stroke="url(#lb-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 58 18 C 38 18 20 32 20 52 C 20 62 26 70 30 76 C 24 84 26 98 38 106 C 46 111 54 110 58 108" />
    <path d="M 40 44 L 56 54 L 42 74 L 58 84" stroke-width="3.5" stroke-dasharray="0.5 1" opacity="0.85" />
    <path d="M 56 34 L 38 58 L 56 70" stroke-width="3.5" opacity="0.75" />
  </g>

  <!-- Left Neural Nodes (Synapse Points) -->
  <g fill="url(#lb-grad)">
    <circle cx="58" cy="18" r="4.5" />
    <circle cx="38" cy="36" r="4" />
    <circle cx="20" cy="54" r="4" />
    <circle cx="42" cy="56" r="3.5" />
    <circle cx="28" cy="78" r="4" />
    <circle cx="40" cy="94" r="4" />
    <circle cx="58" cy="108" r="4.5" />
  </g>

  <!-- Central Hemispheric Divide / Synaptic Bridge -->
  <g stroke="url(#lb-grad)" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="58" y1="24" x2="58" y2="40" />
    <line x1="58" y1="52" x2="58" y2="76" />
    <line x1="58" y1="88" x2="58" y2="102" />
  </g>

  <!-- Right Hemisphere: Terminal Command Prompt & Cortex -->
  <g fill="none" stroke="url(#lb-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 68 18 C 86 18 102 30 106 46" />
    <path d="M 106 82 C 100 98 84 110 68 110" />
    <path d="M 72 46 L 94 64 L 72 82" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="98" y1="82" x2="114" y2="82" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Right Brain Micro Nodes -->
  <g fill="url(#lb-grad)">
    <circle cx="68" cy="18" r="4.5" />
    <circle cx="106" cy="46" r="4" />
    <circle cx="106" cy="82" r="4" />
    <circle cx="68" cy="110" r="4.5" />
  </g>
</svg>
